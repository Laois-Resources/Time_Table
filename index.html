<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Timetable</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div>
                <h1 id="appTitle">Weekly Timetable</h1>
                <p id="appSubtitle">
                    Your simple weekly schedule
                </p>
            </div>

            <div class="header-actions">
                <button id="languageBtn" class="secondary-btn">
                    العربية
                </button>

                <button id="themeBtn" class="secondary-btn">
                    🌙
                </button>

                <button id="addEventBtn" class="primary-btn">
                    + <span id="addEventText">Add Event</span>
                </button>
            </div>

        </header>


        <!-- WEEK CONTROLS -->
        <section class="week-controls">

            <button id="previousWeekBtn" class="control-btn">
                ← <span id="previousText">Previous</span>
            </button>

            <button id="todayBtn" class="control-btn">
                <span id="todayText">Today</span>
            </button>

            <div id="weekLabel" class="week-label">
                Weekly Schedule
            </div>

            <button id="nextWeekBtn" class="control-btn">
                <span id="nextText">Next</span> →
            </button>

        </section>


        <!-- TABLE -->
        <main class="schedule-wrapper">

            <div class="table-scroll">

                <table id="scheduleTable">

                    <thead>
                        <tr>
                            <th class="time-column" id="timeHeader">
                                Time
                            </th>

                            <th>
                                <span class="day-name" data-day="0">
                                    Monday
                                </span>
                            </th>

                            <th>
                                <span class="day-name" data-day="1">
                                    Tuesday
                                </span>
                            </th>

                            <th>
                                <span class="day-name" data-day="2">
                                    Wednesday
                                </span>
                            </th>

                            <th>
                                <span class="day-name" data-day="3">
                                    Thursday
                                </span>
                            </th>

                            <th>
                                <span class="day-name" data-day="4">
                                    Friday
                                </span>
                            </th>

                            <th>
                                <span class="day-name" data-day="5">
                                    Saturday
                                </span>
                            </th>

                            <th>
                                <span class="day-name" data-day="6">
                                    Sunday
                                </span>
                            </th>
                        </tr>
                    </thead>

                    <tbody id="scheduleBody"></tbody>

                </table>

            </div>

            <div class="table-hint" id="tableHint">
                Click an empty time slot to add an event.
            </div>

        </main>

    </div>


    <!-- ADD / EDIT MODAL -->
    <div id="eventModal" class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Event
                </h2>

                <button id="closeModalBtn" class="close-btn">
                    ×
                </button>

            </div>


            <form id="eventForm">

                <input type="hidden" id="eventId">


                <!-- TITLE -->
                <div class="form-group">

                    <label for="eventTitle" id="titleLabel">
                        Event / Class
                    </label>

                    <input
                        type="text"
                        id="eventTitle"
                        placeholder="e.g. Web Development"
                        required
                    >

                </div>


                <!-- DAY -->
                <div class="form-group">

                    <label for="eventDay" id="dayLabel">
                        Day
                    </label>

                    <select id="eventDay" required>

                        <option value="0">Monday</option>
                        <option value="1">Tuesday</option>
                        <option value="2">Wednesday</option>
                        <option value="3">Thursday</option>
                        <option value="4">Friday</option>
                        <option value="5">Saturday</option>
                        <option value="6">Sunday</option>

                    </select>

                </div>


                <!-- START / END -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="eventStart" id="startLabel">
                            Start
                        </label>

                        <input
                            type="time"
                            id="eventStart"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="eventEnd" id="endLabel">
                            End
                        </label>

                        <input
                            type="time"
                            id="eventEnd"
                            required
                        >

                    </div>

                </div>


                <!-- LOCATION -->
                <div class="form-group">

                    <label for="eventLocation" id="locationLabel">
                        Location
                    </label>

                    <input
                        type="text"
                        id="eventLocation"
                        placeholder="e.g. Room 204"
                    >

                </div>


                <!-- REPEAT -->
                <div class="form-group">

                    <label for="eventRepeat" id="repeatLabel">
                        Repeat
                    </label>

                    <select id="eventRepeat">

                        <option value="weekly">
                            Every week
                        </option>

                        <option value="once">
                            Once only
                        </option>

                    </select>

                </div>


                <!-- COLOR -->
                <div class="form-group">

                    <label for="eventColor" id="colorLabel">
                        Colour
                    </label>

                    <input
                        type="color"
                        id="eventColor"
                        value="#4f46e5"
                    >

                </div>


                <!-- NOTES -->
                <div class="form-group">

                    <label for="eventNotes" id="notesLabel">
                        Notes
                    </label>

                    <textarea
                        id="eventNotes"
                        rows="3"
                        placeholder="Optional notes..."
                    ></textarea>

                </div>


                <!-- BUTTONS -->
                <div class="form-actions">

                    <button
                        type="button"
                        id="deleteEventBtn"
                        class="danger-btn hidden"
                    >
                        Delete
                    </button>

                    <div class="form-actions-right">

                        <button
                            type="button"
                            id="cancelBtn"
                            class="secondary-btn"
                        >
                            Cancel
                        </button>

                        <button
                            type="submit"
                            class="primary-btn"
                        >
                            <span id="saveText">Save</span>
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- TOAST -->
    <div id="toast" class="toast"></div>


    <script src="script.js"></script>

</body>
</html>
