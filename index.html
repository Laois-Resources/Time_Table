<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Planner</title>

    <link rel="icon" type="image/png" href="https://img.icons8.com/Dusk_Wired/1200/microsoft-planner.jpg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div>
            <h1 id="appTitle">Weekly Planner</h1>
            <p id="appSubtitle">
                Organise what you need to do each week.
            </p>
        </div>

        <div class="header-actions">

            <button id="languageBtn" class="secondary-btn">
                العربية
            </button>

            <button id="themeBtn" class="secondary-btn">
                🌙
            </button>

            <button id="addBtn" class="primary-btn">
                + Add
            </button>

        </div>

    </header>


    <!-- TABLE -->
    <section class="table-container">

        <div class="table-scroll">

            <table>

                <thead>

                    <tr>

                        <th>Day</th>

                        <th>What to do</th>

                        <th>Time</th>

                        <th>Location</th>

                        <th>Notes</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="taskTableBody">
                    <!-- JavaScript adds rows here -->
                </tbody>

            </table>

        </div>

        <div id="emptyMessage" class="empty-message">
            No tasks added yet.
        </div>

    </section>

</div>


<!-- ADD / EDIT MODAL -->

<div id="modal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Task
            </h2>

            <button id="closeModalBtn" class="close-btn">
                ×
            </button>

        </div>


        <form id="taskForm">

            <input
                type="hidden"
                id="taskId"
            >


            <!-- DAY -->

            <div class="form-group">

                <label for="taskDay">
                    Day
                </label>

                <select id="taskDay" required>

                    <option value="0">Monday</option>
                    <option value="1">Tuesday</option>
                    <option value="2">Wednesday</option>
                    <option value="3">Thursday</option>
                    <option value="4">Friday</option>
                    <option value="5">Saturday</option>
                    <option value="6">Sunday</option>

                </select>

            </div>


            <!-- WHAT TO DO -->

            <div class="form-group">

                <label for="taskTitle">
                    What do you need to do?
                </label>

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="e.g. Test, Meeting, Assignment..."
                    required
                >

            </div>


            <!-- TIME -->

            <div class="form-row">

                <div class="form-group">

                    <label for="taskStart">
                        Start time
                    </label>

                    <select
                        id="taskStart"
                        required
                    >
                        <!-- JavaScript populates 15-min options -->
                    </select>

                </div>


                <div class="form-group">

                    <label for="taskEnd">
                        End time
                    </label>

                    <select
                        id="taskEnd"
                        required
                    >
                        <!-- JavaScript populates 15-min options -->
                    </select>

                </div>

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label for="taskLocation">
                    Location
                </label>

                <input
                    type="text"
                    id="taskLocation"
                    placeholder="e.g. Room 204"
                >

            </div>


            <!-- NOTES -->

            <div class="form-group">

                <label for="taskNotes">
                    Notes
                </label>

                <textarea
                    id="taskNotes"
                    rows="3"
                    placeholder="Optional notes..."
                ></textarea>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <button
                    type="button"
                    id="deleteBtn"
                    class="danger-btn hidden"
                >
                    Delete
                </button>


                <div class="right-buttons">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="secondary-btn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>


<!-- TOAST -->

<div id="toast" class="toast"></div>


<script src="script.js"></script>

</body>
</html>
